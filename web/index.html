<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#edf2f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AdventureMeets" />
    <meta property="og:title" content="AdventureMeets" />
    <meta property="og:description" content="Join events on AdventureMeets." />
    <meta property="og:image" content="/static/adventuremeets-logo.png" />
    <meta property="og:url" content="" />
    <title>AdventureMeets</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      html {
        height: 100%;
        min-height: 100%;
        background:
          radial-gradient(
            circle at top,
            rgba(47, 109, 181, 0.2),
            transparent 45%
          ),
          linear-gradient(180deg, #f7fafc 0%, #edf2f7 100%);
        background-color: #edf2f7;
        color-scheme: light;
      }

      body {
        margin: 0;
        height: 100%;
        min-height: 100vh;
        background: inherit;
        background-color: #edf2f7;
      }

      #root {
        min-height: 100%;
        background: transparent;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(
            circle at top,
            rgba(47, 109, 181, 0.2),
            transparent 45%
          ),
          linear-gradient(180deg, #f7fafc 0%, #edf2f7 100%);
        color: #14213d;
        z-index: 9999;
        transition: opacity 220ms ease;
      }

      #boot-splash.boot-splash-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .boot-splash-shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .boot-splash-brand {
        position: relative;
        width: min(220px, 62vw);
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .boot-splash-ring {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        border: 8px solid #a9d2ff;
        border-top-color: #4fa3ff;
        border-right-color: #4fa3ff;
        animation: boot-splash-spin 1.1s linear infinite;
      }

      .boot-splash-logo {
        width: 78%;
        height: auto;
        display: block;
      }

      .boot-splash-text {
        font:
          600 15px/1.2 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        letter-spacing: 0.02em;
      }

      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div
      id="boot-splash"
      aria-live="polite"
      aria-label="Loading AdventureMeets"
    >
      <div class="boot-splash-shell">
        <div class="boot-splash-brand">
          <div class="boot-splash-ring" aria-hidden="true"></div>
          <img
            class="boot-splash-logo"
            src="/static/adventuremeets-logo.png"
            alt="AdventureMeets"
          />
        </div>
        <div class="boot-splash-text">Loading AdventureMeets</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
