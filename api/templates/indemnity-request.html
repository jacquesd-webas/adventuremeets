<h2 style="margin: 0 0 12px 0; font-size: 20px">Accept indemnity</h2>
<p style="margin: 0 0 16px 0">Hi {{attendeeName}},</p>
<p style="margin: 0 0 16px 0">
  The indemnity for {{meetName}} has not yet been accepted. Please review the
  indemnity and accept it using the button below.
</p>
<p style="margin: 0 0 16px 0; text-align: center">
  <a
    href="{{acceptanceUrl}}"
    style="display:inline-block;background:{{primaryColor}};color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;"
    >Review and accept indemnity</a
  >
</p>
<p style="margin: 0 0 16px 0; font-size: 13px; color: #475569">
  If the button doesn't work, copy and paste this link into your browser:
</p>
<p
  style="
    word-break: break-all;
    font-size: 13px;
    color: #475569;
    margin: 0 0 16px 0;
  "
>
  {{acceptanceUrl}}
</p>
