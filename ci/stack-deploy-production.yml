version: "3.8"
services:
  db_migrate:
    image: fringecoding/adventuremeets_db_migrate:${VERSION:-latest}
    env_file:
      - ./.env
    environment:
      DB_SEED_DATA: ${DB_SEED_DATA:-0}
    volumes:
      - ./backups:/app/db/backup
    networks:
      - adventuremeets
    deploy:
      replicas: 0

  api:
    image: fringecoding/adventuremeets_api:${VERSION:-latest}
    env_file:
      - ./.env
    environment:
      WHATSAPP_SERVICE_URL: http://whatsapp:3010
    ports:
      - "8005:8080"
    networks:
      - adventuremeets
    deploy:
      replicas: 2

  worker:
    image: fringecoding/adventuremeets_worker:${VERSION:-latest}
    env_file:
      - ./.env
    networks:
      - adventuremeets
    deploy:
      replicas: 1

  whatsapp:
    image: fringecoding/adventuremeets_worker:${VERSION:-latest}
    env_file:
      - ./.env
    environment:
      WHATSAPP_SESSION_DIR: /var/lib/adventuremeets/whatsapp
    command: ["node", "/app/worker/dist/whatsapp/main.js"]
    volumes:
      - whatsapp_sessions:/var/lib/adventuremeets/whatsapp
    networks:
      - adventuremeets
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == webapps4

  mail:
    image: fringecoding/adventuremeets_mail:${VERSION:-latest}
    env_file:
      - ./.env
    ports:
      - "1025:25"
    networks:
      - adventuremeets
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == webapps4

networks:
  adventuremeets:

volumes:
  whatsapp_sessions:
